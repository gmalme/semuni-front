<app-loading-overlay
  [active]="carregando"
  message="Carregando carros...">
</app-loading-overlay>

<div class="page-shell">

  <div class="page-header">
    <h1>Carros</h1>
    <div class="page-header-actions">
      <button mat-raised-button color="primary" (click)="novo()">
        <mat-icon>add</mat-icon>
        <span>Incluir</span>
      </button>
    </div>
  </div>

  <div class="table-wrapper mat-elevation-z2">
    <table mat-table [dataSource]="data" class="full-width-table">

      <ng-container matColumnDef="marca">
        <th mat-header-cell *matHeaderCellDef>Marca</th>
        <td mat-cell *matCellDef="let c">{{ c.marca }}</td>
      </ng-container>

      <ng-container matColumnDef="modelo">
        <th mat-header-cell *matHeaderCellDef>Modelo</th>
        <td mat-cell *matCellDef="let c">{{ c.modelo }}</td>
      </ng-container>

      <ng-container matColumnDef="ano">
        <th mat-header-cell *matHeaderCellDef>Ano</th>
        <td mat-cell *matCellDef="let c">{{ c.ano }}</td>
      </ng-container>

      <ng-container matColumnDef="problema">
        <th mat-header-cell *matHeaderCellDef>Problema</th>
        <td mat-cell *matCellDef="let c">{{ c.problema }}</td>
      </ng-container>

      <ng-container matColumnDef="diagnostico">
        <th mat-header-cell *matHeaderCellDef>Diagnóstico</th>
        <td mat-cell *matCellDef="let c">{{ c.diagnostico }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-col"></th>
        <td mat-cell *matCellDef="let c" class="actions-col">
          <button mat-icon-button color="primary" (click)="editar(c)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deletar(c)" matTooltip="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
