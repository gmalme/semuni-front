<app-loading-overlay [active]="busy" [message]="busyMessage"></app-loading-overlay>

<div class="page-shell">
    <div class="page-header">
        <h1>{{ titulo }}</h1>

        <div class="page-header-actions">
            <button mat-stroked-button color="primary" type="button" (click)="cancelar()">
                <mat-icon>arrow_back</mat-icon>
                <span>Voltar</span>
            </button>

            <button mat-raised-button color="primary"
                    type="submit"
                    form="carroForm"
                    [disabled]="form.invalid || salvando">
                <mat-icon>save</mat-icon>
                <span>Salvar</span>
            </button>
        </div>
    </div>

    <div class="form-card">
        <h2 class="form-title">Dados do Carro</h2>

        <form [formGroup]="form" class="form-grid" id="carroForm" (ngSubmit)="salvar()">
            <mat-form-field appearance="outline">
                <mat-label>Marca*</mat-label>
                <input matInput formControlName="marca" />
                <mat-error *ngIf="form.get('marca')?.hasError('required')">Obrigatório</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Modelo*</mat-label>
                <input matInput formControlName="modelo" />
                <mat-error *ngIf="form.get('modelo')?.hasError('required')">Obrigatório</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Ano*</mat-label>
                <input matInput type="number" formControlName="ano" />
                <mat-error *ngIf="form.get('ano')?.hasError('required')">Obrigatório</mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-col">
                <mat-label>Problema* (relato do cliente)</mat-label>
                <textarea matInput rows="4" formControlName="problema"></textarea>
                <mat-error *ngIf="form.get('problema')?.hasError('required')">Obrigatório</mat-error>
            </mat-form-field>
        </form>
    </div>
</div>
